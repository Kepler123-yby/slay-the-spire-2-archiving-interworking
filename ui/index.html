<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';script-src 'self';style-src 'self';img-src 'self' data:;connect-src 'none'"
    />
    <title>尖塔存档桥</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <span class="mark">♜</span>
      <div>
        <h1>尖塔存档桥</h1>
        <p>在下一台电脑，继续你的攀登。</p>
      </div>
      <span class="edition">验证版</span>
    </header>
    <main>
      <aside>
        <h2>本机进度</h2>
        <label for="profiles">Steam 档位</label
        ><select id="profiles"></select
        ><label for="group">本次同步组</label
        ><select id="group">
          <option value="modded">Mod 进度</option>
          <option value="vanilla">原版进度</option>
        </select>
        <div id="local" class="local"></div>
        <div class="checks">
          <label
            ><input id="ready" type="checkbox" />我已关闭两端 Steam
            云，确认游戏版本与 Mod 环境一致</label
          >
        </div>
        <button id="upload" class="primary">上传本机进度</button>
        <div class="utility-actions">
          <button id="backup">备份本机进度（本地）</button>
          <button id="login">登录夸克网盘</button>
          <button id="probe">验证夸克连接</button>
        </div>
        <p class="hint">
          自行选择上传来源。每次上传保留独立版本，应用前自动备份。同步组不会切换游戏的
          Mod。
        </p>
      </aside>
      <section>
        <div id="overview" aria-live="polite"></div>
        <div class="sectionhead">
          <h2>云端版本</h2>
          <button id="refresh">刷新版本</button>
        </div>
        <p>每次上传保存一个完整版本。选择来源、时间都正确的进度后再应用。</p>
        <div class="overwrite-flow">
          <label for="cloudVersion">选择要覆盖到本机的云端版本</label>
          <select id="cloudVersion" disabled>
            <option value="">请先刷新版本，再选择来源</option>
          </select>
          <div id="selectedVersion" aria-live="polite">
            <p class="hint">选择版本只会预览，不会修改存档。</p>
          </div>
          <button id="overwrite" class="primary" disabled>
            下载并覆盖当前存档
          </button>
          <p class="hint">
            覆盖前自动在本机保存备份，再用所选云端版本替换当前档位。覆盖前的备份不会自动上传到夸克。
          </p>
        </div>
        <div id="versions" class="versions">
          <p class="empty">
            点击“刷新版本”查看夸克中的存档。<br />Steam
            云与夸克是两个独立的存储位置。
          </p>
        </div>
        <details>
          <summary>恢复本地备份</summary>
          <button id="listBackups">查看备份</button>
          <div id="backups"></div>
        </details>
        <div id="status" role="status" aria-live="polite">
          准备就绪。真实存档尚未上传或修改。
        </div>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
